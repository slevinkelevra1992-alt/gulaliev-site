<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Гюльалиев Саидали Феликсович — GULALIEV AND PARTNERS</title>
  <meta name="description" content="Гюльалиев Саидали Феликсович — Архитектор, руководитель архитектурного бюро GULALIEV AND PARTNERS.">
  <style>
    :root {
      --bg: #E8E3DA;
      --ink: #161615;
      --muted: #55524D;
      --accent: #D94E1F;
      --glass-surface: rgba(250, 249, 246, 0.56);
      --glass-border: rgba(255, 255, 255, 0.72);
      --btn-glass: rgba(255, 255, 255, 0.42);
      --btn-glass-hover: rgba(255, 255, 255, 0.68);
      --btn-border: rgba(255, 255, 255, 0.88);
      --btn-orange-glass: rgba(217, 78, 31, 0.80);
      --btn-orange-border: rgba(255, 210, 192, 0.95);
      --radius-btn: 14px;
      --radius-card: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      line-height: 1.45;
      position: relative;
      overflow-x: hidden;
    }

    /* Тот самый чистый фон из предыдущей итерации */
    .ambient-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(42px);
    }

    .orb-terracotta {
      width: 240px;
      height: 240px;
      background-color: rgba(217, 78, 31, 0.22);
      top: calc(50% - 260px);
      right: calc(50% - 210px);
    }

    .orb-sand {
      width: 290px;
      height: 290px;
      background-color: rgba(255, 252, 245, 0.85);
      top: calc(50% - 140px);
      left: calc(50% - 220px);
    }

    .orb-stone {
      width: 260px;
      height: 260px;
      background-color: rgba(186, 177, 162, 0.45);
      bottom: calc(50% - 280px);
      left: calc(50% - 120px);
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.35;
    }

    .sheet {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 376px;
      min-height: 580px;
      background-color: var(--glass-surface);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 48px 28px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(22, 22, 21, 0.10);
    }

    .header-block {
      margin-bottom: 36px;
      opacity: 0;
      transform: translateY(8px);
      animation: revealUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    .accent-rule {
      width: 28px;
      height: 3px;
      border-radius: 2px;
      background-color: var(--accent);
      margin-bottom: 24px;
      transform-origin: left center;
      transform: scaleX(0);
      animation: drawRule 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 10px;
      text-wrap: balance;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }

    .action-item {
      opacity: 0;
      transform: translateY(8px);
      animation: revealUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .action-item:nth-child(1) { animation-delay: 0.12s; }
    .action-item:nth-child(2) { animation-delay: 0.18s; }
    .action-item:nth-child(3) { animation-delay: 0.24s; }
    .action-item:nth-child(4) { animation-delay: 0.30s; }
    .action-item:nth-child(5) { animation-delay: 0.36s; }

    /* Стеклянные кнопки с сохранением всех фирменных анимаций */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      text-decoration: none;
      color: var(--ink);
      background-color: var(--btn-glass);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition:
        background-color 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.22s cubic-bezier(0.22, 1, 0.36, 1),
        color 0.18s ease,
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: left;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Возвращена анимированная оранжевая линия слева при наведении */
    .btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: var(--accent);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease;
      z-index: 2;
    }

    /* Стеклянный блик по верхней грани кнопки */
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      transition: background-color 0.22s ease;
      z-index: 2;
    }

    .btn-label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-sub {
      position: relative;
      z-index: 2;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      transition: color 0.18s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Световая волна оранжевого стекла из точки нажатия */
    .btn-ripple {
      position: absolute;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      margin-top: -14px;
      border-radius: 50%;
      background-color: rgba(255, 236, 226, 0.38);
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s ease;
    }

    /* Анимация при наведении (живой отклик кнопки, линии и текста) */
    .btn:hover {
      background-color: var(--btn-glass-hover);
      border-color: #FFFFFF;
      transform: translateY(-1px);
    }

    .btn:not(.btn-primary):hover::before {
      transform: scaleY(1);
    }

    .btn:not(.btn-primary):hover .btn-label {
      transform: translateX(3px);
    }

    .btn:hover .btn-sub {
      color: var(--ink);
    }

    /* Анимация нажатия — вспышка оранжевым матовым стеклом */
    .btn:active,
    .btn.is-pressed,
    .btn-primary:active,
    .btn-primary.is-pressed {
      background-color: var(--btn-orange-glass);
      backdrop-filter: blur(24px) saturate(210%);
      -webkit-backdrop-filter: blur(24px) saturate(210%);
      border-color: var(--btn-orange-border);
      color: #FAF9F6;
      transform: scale(0.978);
    }

    .btn:active::before,
    .btn.is-pressed::before {
      transform: scaleY(1);
      background-color: #FAF9F6;
    }

    .btn:active::after,
    .btn.is-pressed::after {
      background-color: rgba(255, 235, 224, 0.95);
    }

    .btn:active .btn-label,
    .btn.is-pressed .btn-label {
      transform: translateX(4px);
    }

    .btn.is-pressed .btn-ripple {
      transform: scale(15);
      opacity: 1;
    }

    .btn:active .btn-sub,
    .btn.is-pressed .btn-sub {
      color: rgba(250, 249, 246, 0.95);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Первая кнопка — темное матовое стекло в покое, при нажатии тоже переходит в оранжевое стекло */
    .btn-primary {
      background-color: rgba(22, 22, 21, 0.84);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-color: rgba(255, 255, 255, 0.25);
      color: #FAF9F6;
    }

    .btn-primary::after {
      background-color: rgba(255, 255, 255, 0.28);
    }

    .btn-primary:hover {
      background-color: rgba(36, 36, 34, 0.92);
      border-color: rgba(255, 255, 255, 0.42);
      transform: translateY(-1px);
    }

    .btn-plus {
      color: var(--accent);
      font-weight: 600;
      margin-right: 6px;
      display: inline-block;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s ease;
    }

    .btn-primary:hover .btn-plus {
      transform: rotate(90deg);
    }

    .btn-primary:active .btn-plus,
    .btn-primary.is-pressed .btn-plus {
      color: #FAF9F6;
      transform: rotate(90deg) scale(1.1);
    }

    .footer {
      border-top: 1px solid rgba(22, 22, 21, 0.09);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      opacity: 0;
      animation: revealUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
    }

    @keyframes drawRule {
      to { transform: scaleX(1); }
    }

    @keyframes revealUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header-block,
      .accent-rule,
      .action-item,
      .footer {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-stage" aria-hidden="true">
    <div class="ambient-orb orb-terracotta"></div>
    <div class="ambient-orb orb-sand"></div>
    <div class="ambient-orb orb-stone"></div>
    <svg class="ambient-grid" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <defs>
        <pattern id="arch-grid" width="64" height="64" patternUnits="userSpaceOnUse">
          <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#161615" stroke-width="0.5" stroke-opacity="0.12" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#arch-grid)" />
    </svg>
  </div>

  <main class="sheet">
    <div class="header-block">
      <div class="accent-rule" aria-hidden="true"></div>
      <h1>Гюльалиев Саидали Феликсович</h1>

    <div class="actions">
      <div class="action-item">
        <button type="button" class="btn btn-primary" onclick="downloadVCard()">
          <span class="btn-label"><span class="btn-plus">+</span>Добавить в контакты</span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </button>
      </div>

      <div class="action-item">
        <a id="wa-link" href="https://wa.me/79898851731?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%A1%D0%B0%D0%B8%D0%B4%D0%B0%D0%BB%D0%B8%20%D0%A4%D0%B5%D0%BB%D0%B8%D0%BA%D1%81%D0%BE%D0%B2%D0%B8%D1%87!" target="_blank" rel="noopener" class="btn">
          <span class="btn-label">Написать в WhatsApp</span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </a>
      </div>

      <div class="action-item">
        <a id="tg-app-link" href="tg://resolve?domain=gulaliev" class="btn">
          <span class="btn-label">Написать в Телеграм</span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </a>
      </div>

      <div class="action-item">
        <a id="tel-link" href="tel:+79898851731" class="btn">
          <span class="btn-label">Позвонить</span>
          <span class="btn-sub" id="phone-label">+7 (989) 885-17-31</span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </a>
      </div>

      <div class="action-item">
        <a id="mail-link" href="mailto:saidali-92@mail.ru" class="btn">
          <span class="btn-label">Написать на почту</span>
          <span class="btn-sub" id="mail-label">saidali-92@mail.ru</span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </a>
      </div>
    </div>

    <div class="footer">
      <span>GULALIEV AND PARTNERS</span>
    </div>
  </main>

  <script>
    const CONTACT = {
      firstName: "Саидали",
      middleName: "Феликсович",
      lastName: "Гюльалиев",
      org: "GULALIEV AND PARTNERS",
      title: "Архитектор, руководитель архитектурного бюро",
      phoneClean: "+79898851731",
      phoneDisplay: "+7 (989) 885-17-31",
      whatsappNumber: "79898851731",
      telegramUser: "gulaliev",
      email: "saidali-92@mail.ru",
      website: "https://gulaliev.ru"
    };

    document.querySelectorAll(".btn").forEach((btn) => {
      let releaseTimer = null;

      btn.addEventListener("pointerdown", (e) => {
        if (releaseTimer) clearTimeout(releaseTimer);
        const rect = btn.getBoundingClientRect();
        const ripple = btn.querySelector(".btn-ripple");
        if (ripple) {
          ripple.style.left = (e.clientX - rect.left) + "px";
          ripple.style.top = (e.clientY - rect.top) + "px";
        }
        btn.classList.add("is-pressed");
      });

      const release = () => {
        releaseTimer = setTimeout(() => {
          btn.classList.remove("is-pressed");
        }, 380);
      };

      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    });

    function downloadVCard() {
      const vcf = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:" + CONTACT.lastName + ";" + CONTACT.firstName + ";" + CONTACT.middleName + ";;",
        "FN:" + CONTACT.lastName + " " + CONTACT.firstName + " " + CONTACT.middleName,
        "ORG:" + CONTACT.org,
        "TITLE:" + CONTACT.title,
        "TEL;TYPE=CELL,VOICE:" + CONTACT.phoneClean,
        "EMAIL;TYPE=WORK,INTERNET:" + CONTACT.email,
        "URL:" + CONTACT.website,
        "NOTE:GULALIEV AND PARTNERS. Telegram: @" + CONTACT.telegramUser,
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Saidali_Gyulaliev.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
